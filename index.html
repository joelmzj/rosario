<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santo Rosario Interactivo</title>
    
    <!-- Tipografías Premium desde Google Fonts (Lora para rezos, Cinzel para Títulos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Cinzel:wght@400..700&display=swap" rel="stylesheet" />
    
    <!-- Enlace al manifiesto de la PWA para instalación offline -->
    <link rel="manifest" href="/rosario/manifest.json" />
  </head>
  <body class="bg-slate-950 text-slate-100 h-full antialiased font-serif selection:bg-amber-500/30 selection:text-amber-200" x-data="rosarioApp">

    <div class="flex h-full min-h-screen flex-col md:flex-row">
      
      <!-- 1. BARRA LATERAL (LÍNEA DE VIDA - HITOS) -->
      <aside 
        :class="menuAbierto ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
        class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r border-slate-900 bg-slate-950/95 p-6 transition-transform duration-300 ease-in-out md:static md:z-0 md:bg-slate-950">
        
        <div class="flex items-center justify-between border-b border-slate-900 pb-4">
          <h2 class="font-display text-xl font-bold tracking-wider text-amber-500">Misterios</h2>
          <button @click="menuAbierto = false" class="text-slate-400 hover:text-white md:hidden focus:outline-none">
            ✕
          </button>
        </div>

        <!-- Menú de Hitos Dinámico -->
        <nav class="mt-6 flex-1 space-y-1 overflow-y-auto scrollbar-thin pr-1">
          <template x-for="hito in hitos" :key="hito.index">
            <button 
              @click="irAPaso(hito.index)"
              :class="pasoActualIndex === hito.index ? 'bg-amber-500/10 text-amber-400 border-amber-500/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900 border-transparent'"
              class="w-full text-left px-4 py-2.5 rounded-lg border text-sm font-medium transition-all duration-200"
              x-text="hito.titulo">
            </button>
          </template>
        </nav>

        <div class="border-t border-slate-900 pt-4 text-center">
          <p class="text-xs text-slate-600">Santo Rosario Interactivo PWA</p>
        </div>
      </aside>

      <!-- Overlay para móviles -->
      <div 
        x-show="menuAbierto" 
        @click="menuAbierto = false" 
        class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-xs md:hidden"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0">
      </div>

      <!-- 2. CONTENIDO PRINCIPAL -->
      <main class="flex flex-1 flex-col h-full overflow-y-auto">
        
        <!-- CABECERA -->
        <header class="sticky top-0 z-30 flex items-center justify-between border-b border-slate-900 bg-slate-950/80 px-6 py-4 backdrop-blur-md">
          <div class="flex items-center gap-3">
            <button @click="menuAbierto = true" class="text-slate-400 hover:text-white md:hidden focus:outline-none">
              ☰
            </button>
            <h1 class="font-display text-lg font-bold tracking-widest text-amber-500 md:text-xl">RE-ROSARIO</h1>
          </div>
          
          <div class="flex items-center gap-2">
            <select 
              x-model="tipoRosario" 
              class="bg-slate-900 border border-slate-800 text-slate-200 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-amber-500">
              <option value="normal">Estándar</option>
              <option value="difuntos">De Difuntos</option>
            </select>
          </div>
        </header>

        <!-- PANEL DE CONFIGURACIÓN DE DIFUNTOS (Reactivo y Modular) -->
        <template x-if="tipoRosario === 'difuntos'">
          <div class="bg-slate-900/40 border-b border-slate-900 p-6 animate-fade-in">
            <div class="max-w-2xl mx-auto space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Nombre del Difunto</label>
                  <div class="relative flex items-center">
                    <input 
                      type="text" 
                      x-model="nombreDifunto" 
                      placeholder="Escribe su nombre..."
                      class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-3 pr-10 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500" />
                    
                    <!-- Botón para borrar el nombre guardado con un clic -->
                    <template x-if="nombreDifunto">
                      <button 
                        @click="limpiarNombre()" 
                        title="Borrar nombre"
                        class="absolute right-2.5 text-slate-500 hover:text-amber-400 text-xs font-bold px-1.5 py-0.5 rounded transition-colors focus:outline-none">
                        ✕
                      </button>
                    </template>
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Género del Difunto</label>
                  <div class="flex items-center gap-4 py-2">
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
                      <input type="radio" value="hermano" x-model="generoDifunto" class="accent-amber-500" /> Hermano
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
                      <input type="radio" value="hermana" x-model="generoDifunto" class="accent-amber-500" /> Hermana
                    </label>
                  </div>
                </div>
                <div class="text-center md:text-right">
                  <button 
                    @click="reiniciar()" 
                    class="text-xs text-amber-500 hover:text-amber-400 font-semibold border border-amber-500/20 px-4 py-2 rounded-lg hover:bg-amber-500/5 transition-all">
                    Reiniciar Rezo
                  </button>
                </div>
              </div>

              <!-- OPCIONES DE LITURGIA MODULAR -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-slate-800/60 pt-4">
                <label class="flex items-start gap-2.5 cursor-pointer text-xs md:text-sm text-slate-300 group">
                  <input type="checkbox" x-model="incluirRitosIniciales" class="accent-amber-500 mt-1 rounded border-slate-800 bg-slate-950" />
                  <span class="group-hover:text-slate-100 transition-colors">Incluir Ritos Iniciales del Velorio (Pésame, Evangelio, etc.)</span>
                </label>
                <label class="flex items-start gap-2.5 cursor-pointer text-xs md:text-sm text-slate-300 group">
                  <input type="checkbox" x-model="incluirLevantaCruz" class="accent-amber-500 mt-1 rounded border-slate-800 bg-slate-950" />
                  <span class="group-hover:text-slate-100 transition-colors">Incluir Ceremonia de Levantamiento de la Cruz (Rito Final)</span>
                </label>
              </div>
            </div>
          </div>
        </template>

        <!-- CARTA DE ORACIÓN REACTIVA -->
        <section class="flex-1 px-6 py-8 md:py-12">
          <div class="max-w-2xl mx-auto bg-slate-900/20 border border-slate-900/60 rounded-2xl p-6 md:p-10 min-h-[400px] flex flex-col justify-between animate-fade-in" :key="pasoActualIndex">
            
            <div class="space-y-6">

              <!-- A. Render tipo TEXTO estándar -->
              <template x-if="pasoActual.tipo === 'texto'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <p class="text-lg leading-relaxed text-slate-300 font-serif" x-html="formatText(pasoActual.texto)"></p>
                </div>
              </template>

              <!-- B. Render tipo INVOCACIÓN -->
              <template x-if="pasoActual.tipo === 'invocacion'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4">
                    <template x-for="linea in pasoActual.lineas">
                      <div class="border-l-2 border-amber-500/30 pl-4 py-2">
                        <span class="text-xs text-amber-400 font-bold uppercase block tracking-wider">Guía:</span>
                        <p class="text-lg text-slate-200 mt-0.5" x-html="formatText(linea.v)"></p>
                        <span class="text-xs text-slate-500 font-bold uppercase block tracking-wider mt-2">Respuesta:</span>
                        <p class="text-lg italic text-slate-300 mt-0.5" x-html="formatText(linea.r)"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- C. Render tipo ANUNCIO DE MISTERIO -->
              <template x-if="pasoActual.tipo === 'misterio-anuncio'">
                <div class="space-y-6 text-center py-8">
                  <span class="text-amber-500 font-display text-xs tracking-widest uppercase block" x-text="pasoActual.titulo"></span>
                  <h1 class="text-3xl md:text-4xl font-semibold font-display text-slate-100 max-w-xl mx-auto leading-tight" x-text="pasoActual.texto"></h1>
                </div>
              </template>

              <!-- D. Render tipo AVEMARÍAS (Decenario Interactivo) -->
              <template x-if="pasoActual.tipo === 'avemarias'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  
                  <div class="flex justify-center items-center gap-2 py-4 flex-wrap">
                    <template x-for="n in 10">
                      <button 
                        @click="avemariaActual = n"
                        :class="n <= avemariaActual ? 'bg-amber-500 text-slate-950 scale-110 border-amber-400 font-bold' : 'bg-slate-950 text-slate-500 border-slate-900'"
                        class="w-10 h-10 rounded-full border flex items-center justify-center text-sm transition-all duration-300 focus:outline-none"
                        x-text="n">
                      </button>
                    </template>
                  </div>

                  <div class="space-y-4 bg-slate-900/40 p-5 rounded-xl border border-slate-900">
                    <div class="border-b border-slate-900 pb-3">
                      <span class="text-xs uppercase text-amber-500 tracking-wider font-semibold block">Guía (Primera mitad):</span>
                      <p class="text-lg text-slate-200 mt-1" x-html="formatText(pasoActual.guia)"></p>
                    </div>
                    <div>
                      <span class="text-xs uppercase text-slate-500 tracking-wider font-semibold block">Respuesta (Segunda mitad):</span>
                      <p class="text-lg italic text-slate-300 mt-1" x-html="formatText(pasoActual.respuesta)"></p>
                    </div>
                  </div>
                </div>
              </template>

              <!-- E. Render tipo JACULATORIAS MISTERIO -->
              <template x-if="pasoActual.tipo === 'jaculatorias-misterio'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4">
                    <template x-for="oracion in pasoActual.oraciones">
                      <p class="text-lg text-slate-300 leading-relaxed bg-slate-900/20 p-4 rounded-lg border border-slate-900" x-html="formatText(oracion)"></p>
                    </template>
                  </div>
                </div>
              </template>

              <!-- F. Render tipo JACULATORIAS DIFUNTOS -->
              <template x-if="pasoActual.tipo === 'jaculatorias-difuntos'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4">
                    <div class="bg-slate-900/30 p-4 rounded-lg border border-slate-900">
                      <span class="text-xs text-amber-500/80 font-bold uppercase tracking-wider block">Latín:</span>
                      <p class="text-lg italic text-slate-300 mt-1" x-html="formatText(pasoActual.latin)"></p>
                    </div>
                    <div class="bg-slate-900/30 p-4 rounded-lg border border-slate-900">
                      <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block">Español:</span>
                      <p class="text-lg text-slate-300 mt-1" x-html="formatText(pasoActual.espanol)"></p>
                    </div>
                    <div class="border-l-2 border-amber-500/30 pl-4 py-2 space-y-2">
                      <div>
                        <span class="text-xs text-amber-400 font-bold uppercase block">Guía:</span>
                        <p class="text-lg text-slate-200" x-html="formatText(pasoActual.sangreV)"></p>
                      </div>
                      <div>
                        <span class="text-xs text-slate-500 font-bold uppercase block">Todos:</span>
                        <p class="text-lg italic text-slate-300" x-html="formatText(pasoActual.sangreR)"></p>
                      </div>
                    </div>
                    <div class="bg-amber-500/5 p-4 rounded-lg border border-amber-500/10 text-center">
                      <p class="text-lg text-amber-300" x-html="formatText(pasoActual.misericordia)"></p>
                    </div>
                  </div>
                </div>
              </template>

              <!-- G. Render tipo GUÍA-RESPUESTA (Salves / Ofrecimiento) -->
              <template x-if="pasoActual.tipo === 'guia-respuesta'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4 bg-slate-900/40 p-5 rounded-xl border border-slate-900">
                    <div class="border-b border-slate-900 pb-3">
                      <span class="text-xs uppercase text-amber-400 tracking-wider font-semibold block">Guía:</span>
                      <p class="text-lg text-slate-200 mt-1" x-html="formatText(pasoActual.guia)"></p>
                    </div>
                    <div>
                      <span class="text-xs uppercase text-slate-500 tracking-wider font-semibold block">Todos:</span>
                      <p class="text-lg italic text-slate-300 mt-1" x-html="formatText(pasoActual.respuesta)"></p>
                    </div>
                  </div>
                </div>
              </template>

              <!-- H. Render tipo CUARTA SALVE -->
              <template x-if="pasoActual.tipo === 'cuarta-salve' || pasoActual.tipo === 'cuarta-salve-difuntos'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4">
                    <p class="text-lg text-slate-300 leading-relaxed" x-html="formatText(pasoActual.guia)"></p>
                    <div class="border-t border-slate-900 pt-4 space-y-2">
                      <div>
                        <span class="text-xs text-amber-400 font-bold uppercase block">Guía:</span>
                        <p class="text-lg text-slate-200" x-html="formatText(pasoActual.peticion)"></p>
                      </div>
                      <div>
                        <span class="text-xs text-slate-500 font-bold uppercase block">Todos:</span>
                        <p class="text-lg italic text-slate-300" x-html="formatText(pasoActual.promesa)"></p>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- I. Render tipo LETANÍAS -->
              <template x-if="pasoActual.tipo === 'letanias' || pasoActual.tipo === 'letanias-difuntos'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  
                  <div class="w-full bg-slate-950 rounded-full h-1.5 border border-slate-900 overflow-hidden">
                    <div class="bg-amber-500 h-1.5 transition-all duration-300" :style="`width: ${progresoLetaniasPorcentaje()}%`"></div>
                  </div>

                  <div class="bg-slate-900/40 p-6 rounded-xl border border-slate-900 min-h-[160px] flex flex-col justify-center space-y-4">
                    <template x-if="obtenerLetaniaActual().seccion">
                      <span class="text-xs text-amber-500 tracking-wider font-semibold uppercase block" x-text="obtenerLetaniaActual().seccion"></span>
                    </template>

                    <template x-if="obtenerLetaniaActual().tipoSubpaso === 'letania' || obtenerLetaniaActual().tipoSubpaso === 'sufragio-guia'">
                      <div class="space-y-3">
                        <template x-if="obtenerLetaniaActual().titulo">
                          <h3 class="text-lg font-bold text-amber-400" x-text="obtenerLetaniaActual().titulo"></h3>
                        </template>
                        <div>
                          <span class="text-xs text-amber-400/70 uppercase block">Guía:</span>
                          <p class="text-xl text-slate-100" x-html="formatText(obtenerLetaniaActual().v)"></p>
                        </div>
                        <div>
                          <span class="text-xs text-slate-500/70 uppercase block">Respuesta:</span>
                          <p class="text-xl italic text-amber-300" x-html="formatText(obtenerLetaniaActual().r)"></p>
                        </div>
                      </div>
                    </template>

                    <template x-if="obtenerLetaniaActual().tipoSubpaso === 'sufragio-texto'">
                      <div class="space-y-2">
                        <h3 class="text-lg font-bold text-amber-400" x-text="obtenerLetaniaActual().titulo"></h3>
                        <p class="text-lg text-slate-200 leading-relaxed" x-html="formatText(obtenerLetaniaActual().texto)"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- J. Render tipo ORACIÓN FINAL -->
              <template x-if="pasoActual.tipo === 'oracion-final'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4">
                    <p class="text-lg text-slate-200 leading-relaxed bg-slate-900/30 p-5 rounded-xl border border-slate-900" x-html="formatText(pasoActual.oracion)"></p>
                    <div class="border-t border-slate-900 pt-4 space-y-2">
                      <div>
                        <span class="text-xs text-amber-400 font-bold uppercase block">Guía:</span>
                        <p class="text-lg text-slate-200" x-html="formatText(pasoActual.peticion)"></p>
                      </div>
                      <div>
                        <span class="text-xs text-slate-500 font-bold uppercase block">Todos:</span>
                        <p class="text-lg italic text-slate-300" x-html="formatText(pasoActual.promesa)"></p>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- K. Render tipo SÚPLICAS FINALES -->
              <template x-if="pasoActual.tipo === 'suplicas-finales'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <p class="text-lg text-slate-300 leading-relaxed" x-html="formatText(pasoActual.intro)"></p>
                  
                  <div class="space-y-4">
                    <template x-for="(item, idx) in pasoActual.lista">
                      <div class="border-l-2 border-slate-900 pl-4 py-2">
                        <span class="text-xs text-slate-500 font-bold uppercase block" x-text="`Petición ${idx + 1}:`"></span>
                        <p class="text-lg text-slate-200 mt-0.5" x-html="formatText(item)"></p>
                        <div class="mt-2">
                          <span class="text-xs text-amber-500 font-bold uppercase block">Todos responden:</span>
                          <p class="text-lg italic text-amber-300 mt-0.5" x-html="formatText(pasoActual.respuestaComun)"></p>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- L. Render tipo JACULATORIA FINAL -->
              <template x-if="pasoActual.tipo === 'jaculatoria-final'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4 bg-slate-900/40 p-5 rounded-xl border border-slate-900">
                    <div class="border-b border-slate-900 pb-3">
                      <span class="text-xs uppercase text-amber-400 tracking-wider font-semibold block">Guía:</span>
                      <p class="text-lg text-slate-200 mt-1" x-html="formatText(pasoActual.guia)"></p>
                    </div>
                    <div>
                      <span class="text-xs uppercase text-slate-500 tracking-wider font-semibold block">Todos:</span>
                      <p class="text-lg italic text-slate-300 mt-1" x-html="formatText(pasoActual.respuesta)"></p>
                    </div>
                  </div>
                </div>
              </template>

              <!-- M. Render tipo INVOCACIONES DE RESURRECCIÓN -->
              <template x-if="pasoActual.tipo === 'invocaciones-resurreccion'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="space-y-4">
                    <template x-for="(item, idx) in pasoActual.items">
                      <div class="border-l-2 border-slate-900 pl-4 py-2">
                        <p class="text-lg text-slate-200" x-html="formatText(item)"></p>
                        <p class="text-lg italic text-amber-300 mt-1" x-html="formatText(pasoActual.respuestaComun)"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- N. Render tipo RITO CRUZ PASO -->
              <template x-if="pasoActual.tipo === 'rito-cruz-paso'">
                <div class="space-y-6">
                  <h2 class="text-2xl font-bold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  
                  <div class="bg-amber-500/5 p-4 rounded-lg border border-amber-500/10 text-slate-300 leading-relaxed text-lg" x-html="formatText(pasoActual.amonestacion)"></div>
                  
                  <div class="space-y-4">
                    <span class="text-xs text-slate-500 font-bold uppercase tracking-wider block" x-text="pasoActual.indicacion"></span>
                    
                    <div class="bg-slate-900/40 p-5 rounded-xl border border-slate-900 space-y-4">
                      <template x-for="estrofa in pasoActual.estrofas">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 border-b border-slate-900 pb-2">
                          <div>
                            <span class="text-xs text-amber-500 uppercase block">Voz:</span>
                            <p class="text-lg text-slate-200" x-html="formatText(estrofa.v)"></p>
                          </div>
                          <div>
                            <span class="text-xs text-slate-500 uppercase block">Respuesta:</span>
                            <p class="text-lg italic text-slate-300" x-html="formatText(estrofa.r)"></p>
                          </div>
                        </div>
                      </template>
                    </div>

                    <template x-if="pasoActual.cruzVencedor">
                      <div class="bg-amber-500 text-slate-950 p-4 rounded-lg text-center font-bold text-lg" x-html="formatText(pasoActual.cruzVencedor)"></div>
                    </template>

                    <template x-if="pasoActual.cantoAdicional">
                      <div class="bg-slate-900/30 p-4 rounded-lg border border-slate-900 italic text-slate-300 text-lg text-center" x-html="formatText(pasoActual.cantoAdicional)"></div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- O. Render tipo CRUZ TRIUNFANTE -->
              <template x-if="pasoActual.tipo === 'cruz-triunfante'">
                <div class="space-y-6 text-center py-8">
                  <h2 class="text-3xl font-semibold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="text-6xl text-amber-500 animate-pulse my-4">✝</div>
                  <p class="text-xl text-slate-200 leading-relaxed max-w-xl mx-auto" x-html="formatText(pasoActual.texto)"></p>
                </div>
              </template>

              <!-- P. Render tipo FIN -->
              <template x-if="pasoActual.tipo === 'fin'">
                <div class="space-y-6 text-center py-8">
                  <h2 class="text-3xl font-semibold text-amber-500 font-display" x-text="pasoActual.titulo"></h2>
                  <div class="text-5xl my-4">🙏</div>
                  <p class="text-xl text-slate-200 leading-relaxed max-w-lg mx-auto" x-html="formatText(pasoActual.texto)"></p>
                  <p class="text-sm text-slate-500" x-text="pasoActual.indicacion"></p>
                  <button 
                    @click="reiniciar()" 
                    class="mt-6 px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition-all duration-300">
                    Rezar de Nuevo
                  </button>
                </div>
              </template>

            </div>

            <div class="border-t border-slate-900 pt-4 mt-8 flex flex-col md:flex-row justify-between items-center gap-2">
              <span class="text-xs italic text-slate-500" x-text="pasoActual.indicacion || pasoActual.indicacionEspecial"></span>
              <span class="text-xs text-amber-500/70 font-semibold tracking-wider uppercase" x-text="`Paso ${pasoActualIndex + 1} de ${pasos.length}`"></span>
            </div>

          </div>
        </section>

        <!-- 3. BARRA DE CONTROL DE NAVEGACIÓN -->
        <footer class="sticky bottom-0 z-30 flex items-center justify-between border-t border-slate-900 bg-slate-950/90 px-6 py-4 backdrop-blur-md">
          <button 
            @click="anterior()" 
            :disabled="pasoActualIndex === 0 && avemariaActual === 0 && letaniaActualIndex === 0"
            class="px-5 py-2.5 rounded-lg text-sm font-semibold border border-slate-800 hover:bg-slate-900 text-slate-300 disabled:opacity-20 disabled:hover:bg-transparent transition-all">
            Anterior
          </button>
          
          <button 
            @click="siguiente()" 
            class="px-6 py-2.5 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-slate-950 transition-all">
            <span x-text="pasoActual.tipo === 'fin' ? 'Salir' : 'Siguiente'"></span>
          </button>
        </footer>

      </main>

    </div>

    <!-- Script de Alpine -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
