name: Despliegue Automático de PWA

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias limpiamente
        run: npm ci

      - name: 4. Compilar la aplicación para producción
        run: npm run build

      - name: 5. Configurar Pages
        uses: actions/configure-pages@v4

      - name: 6. Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 7. Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
